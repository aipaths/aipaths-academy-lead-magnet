<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technics SL-1200MK7 · tocadiscos 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c4381f'/%3E%3C/svg%3E">
<style>
  :root { --bg:#120e0b; --ink:#eee6da; --mute:#a99d8d; --acc:#e8a24c; --panel:rgba(22,17,13,.78); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; }
  canvas { display:block; cursor:grab; touch-action:none; }
  #title { position:fixed; left:24px; top:20px; pointer-events:none; }
  #title h1 { margin:0; font:600 19px Georgia, serif; letter-spacing:.02em; }
  #title p { margin:2px 0 0; color:var(--mute); font-size:12.5px; max-width:340px; }
  #now { position:fixed; left:50%; top:20px; transform:translateX(-50%); color:var(--acc); font:italic 15px Georgia, serif; min-height:20px; pointer-events:none; text-shadow:0 1px 8px #000; }
  #bar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:8px; padding:9px; background:var(--panel); border:1px solid #ffffff14; border-radius:14px; backdrop-filter:blur(10px); align-items:center; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  button { font:inherit; color:var(--ink); background:#ffffff0d; border:1px solid #ffffff1a; padding:8px 14px; border-radius:9px; cursor:pointer; }
  button:hover { background:#ffffff1c; } button.on { background:var(--acc); color:#1b130b; border-color:var(--acc); font-weight:600; }
  button kbd { color:var(--mute); font:11px ui-monospace, monospace; margin-left:6px; }
  .sep { width:1px; align-self:stretch; background:#ffffff1a; margin:0 4px; }
  #pitch { color:var(--mute); font-variant-numeric:tabular-nums; min-width:86px; text-align:center; }
  #tip { position:fixed; z-index:5; pointer-events:none; max-width:270px; padding:9px 12px; background:rgba(14,11,8,.92); border:1px solid #e8a24c66; border-radius:10px; box-shadow:0 8px 30px #000a; }
  #tip b { display:block; font:600 14px Georgia, serif; color:var(--acc); } #tip span { color:#cfc6b8; font-size:12px; }
  #list { position:fixed; right:18px; top:18px; width:236px; max-height:calc(100vh - 110px); overflow:auto; background:var(--panel); border:1px solid #ffffff14; border-radius:12px; padding:6px; backdrop-filter:blur(10px); }
  #list summary { cursor:pointer; padding:6px 8px; color:var(--mute); } #list ul { list-style:none; margin:0; padding:0; }
  #list li { padding:5px 8px; border-radius:6px; cursor:pointer; font-size:12.5px; } #list li:hover { background:#ffffff14; color:var(--acc); }
  #hud { position:fixed; right:18px; bottom:14px; font:11px ui-monospace, monospace; color:#9fe0a8; text-shadow:0 1px 3px #000; }
  .clean #title, .clean #bar, .clean #list, .clean #now { display:none; }
  #load { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); font:italic 18px Georgia, serif; color:var(--mute); transition:opacity .6s; }
</style>
</head>
<body>
<div id="app"></div>
<div id="title"><h1>Technics SL-1200MK7</h1><p>Arrastrá para girar · rueda para acercar · pasá el mouse por una pieza para ver su nombre.</p></div>
<div id="now"></div>
<div id="bar">
  <button id="play">▶ Reproducir <kbd>espacio</kbd></button>
  <button id="explode">Desarmar <kbd>E</kbd></button>
  <button id="lid">Cerrar tapa <kbd>T</kbd></button>
  <span class="sep"></span>
  <button id="k33" class="on">33</button><button id="k45">45</button>
  <span id="pitch">pitch 0,0 %</span>
  <span class="sep"></span>
  <button id="vfront">Frente</button><button id="vtop">Cenital</button>
</div>
<div id="tip" hidden><b></b><span></span></div>
<details id="list"><summary>Piezas</summary><ul></ul></details>
<div id="hud" hidden></div>
<div id="load">Calentando las válvulas…</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
