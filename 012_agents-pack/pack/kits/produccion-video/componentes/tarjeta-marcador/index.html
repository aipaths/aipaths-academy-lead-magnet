<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Una tarjeta de ejemplo. Para otra etapa: duplicá compositions/tarjeta-marcador.html con otro nombre,
         cambiale el data-composition-id (y la clave de window.__timelines al final) y sumá otro host como
         este, con su id, su data-start (el segundo del video donde entra) y su data-duration. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="tarjeta" data-composition-id="tarjeta-marcador" data-composition-src="compositions/tarjeta-marcador.html"
           data-start="0" data-duration="6" data-track-index="0" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
