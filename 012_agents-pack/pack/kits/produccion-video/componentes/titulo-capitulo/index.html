<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      /* Sólo para la vista previa: un fondo que hace de «tu toma». No sale en el render transparente. */
      #toma {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 30% 40%, #5b6b7a 0%, transparent 55%),
          radial-gradient(circle at 75% 65%, #8a6d55 0%, transparent 50%),
          #2a2f35;
      }
    </style>
  </head>
  <body>
    <!-- Vista previa del título sobre una toma de ejemplo. El título solo, con fondo transparente:
         npm run render:transparente (renderiza compositions/titulo-capitulo.html). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
      <div id="toma" class="clip" data-start="0" data-duration="3.5" data-track-index="0"></div>
      <div id="titulo" data-composition-id="titulo-capitulo" data-composition-src="compositions/titulo-capitulo.html"
           data-start="0.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
