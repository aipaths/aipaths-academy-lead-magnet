<template>
  <!-- Título de capítulo: un velo oscuro sobre tu toma, el título sube y una barra se dibuja debajo.
       Se va solo antes del final. Va encima del video (render con fondo transparente: ver LEEME.md).
       Para cambiarlo, tocá sólo el bloque CONFIGURACIÓN del <script>. -->
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Roboto", sans-serif;
    }
    #tc-velo {
      position: absolute;
      inset: 0;
    }
    #tc-bloque {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #tc-titulo {
      white-space: nowrap; /* que no parta la línea: a 150 px entran ~16 caracteres en 1920 */
      font-weight: 900;
      letter-spacing: -0.015em;
      line-height: 1;
    }
    #tc-barra {
      width: 130px;
      height: 11px;
      border-radius: 6px;
      margin-top: 35px;
      transform-origin: center;
    }
  </style>
  <div id="root" data-composition-id="titulo-capitulo" data-width="1920" data-height="1080">
    <!-- data-duration de #tc-capa = DURACION de abajo (y la del host en index.html). -->
    <div id="tc-capa" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
      <div id="tc-velo"></div>
      <div id="tc-bloque">
        <div id="tc-titulo">La idea</div>
        <div id="tc-barra"></div>
      </div>
    </div>
  </div>
  <script>
    // ───────────── CONFIGURACIÓN ─────────────
    const TITULO = "La idea"; // corto: 1 a 3 palabras
    const TAMANO = 150; // px del título en un cuadro de 1920×1080
    const COLOR_TEXTO = "#f1ebdd"; // crema
    const COLOR_BARRA = "#ffb38a"; // acento
    const COLOR_VELO = "rgba(12, 12, 10, 0.78)"; // oscurece la toma de atrás; 0.78 = bastante
    // Tiempos en segundos, contados desde que aparece el título.
    const DURACION = 2.5; // igual a data-duration de #tc-capa y del host: tiene que terminar antes del próximo corte
    const ENTRA_TITULO = 0.12; // el texto sube un poco después del velo
    const ENTRA_BARRA = 0.35; // la barra se dibuja cuando el título ya está
    const SALE = DURACION - 0.35; // empieza a irse; la salida dura 0,3 s
    // ─────────────────────────────────────────

    const titulo = document.getElementById("tc-titulo");
    titulo.textContent = TITULO;
    titulo.style.fontSize = TAMANO + "px";
    titulo.style.color = COLOR_TEXTO;
    document.getElementById("tc-barra").style.background = COLOR_BARRA;
    document.getElementById("tc-velo").style.background = COLOR_VELO;

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#tc-velo", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0)
      .fromTo(
        "#tc-titulo",
        { opacity: 0, y: 25 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        ENTRA_TITULO,
      )
      .fromTo("#tc-barra", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, ENTRA_BARRA)
      .to(["#tc-titulo", "#tc-barra"], { opacity: 0, duration: 0.3, ease: "power2.in" }, SALE)
      .to("#tc-velo", { opacity: 0, duration: 0.33, ease: "power2.in" }, SALE);
    window.__timelines["titulo-capitulo"] = tl;
  </script>
</template>
