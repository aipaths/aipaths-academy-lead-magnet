<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        /* Persistent background layer */
        .bg-grid {
          position: absolute;
          inset: -120px;
          background-image:
            linear-gradient(
              to right,
              rgba(236, 238, 240, 0.05) 2px,
              transparent 2px
            ),
            linear-gradient(
              to bottom,
              rgba(236, 238, 240, 0.05) 2px,
              transparent 2px
            );
          background-size: 120px 120px;
          will-change: transform;
        }
        .bg-glow {
          position: absolute;
          width: 1400px;
          height: 1400px;
          right: -420px;
          top: -520px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(236, 238, 240, 0.09) 0%,
            rgba(236, 238, 240, 0) 62%
          );
          will-change: transform;
        }
        .bg-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            ellipse at 40% 50%,
            rgba(16, 17, 19, 0) 55%,
            rgba(8, 9, 10, 0.75) 100%
          );
        }
      </style>
      <div
        id="root"
        data-composition-id="bg"
        data-width="1920"
        data-height="1080"
      >
        <div id="bg-grid" class="bg-grid"></div>
        <div id="bg-glow" class="bg-glow"></div>
        <div class="bg-vignette"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });

        // Grid drifts exactly one cell left over the film (seamless, linear).
        tl.fromTo(
          "#bg-grid",
          { x: 0 },
          { x: -120, duration: 20, ease: "none" },
          0,
        );

        // Glow breathes slowly (sine-wave-loop, phase form, low amplitude).
        const glow = document.getElementById("bg-glow");
        const phase = { p: 0 };
        const paint = () => {
          const s = Math.sin(phase.p);
          const c = Math.sin(phase.p * 0.5 + Math.PI / 2);
          glow.style.transform =
            "translate(" +
            (c * 60).toFixed(2) +
            "px," +
            (s * 30).toFixed(2) +
            "px) scale(" +
            (1 + s * 0.06).toFixed(4) +
            ")";
        };
        paint();
        tl.to(
          phase,
          { p: Math.PI * 2 * 4, duration: 20, ease: "none", onUpdate: paint },
          0,
        );

        window.__timelines["bg"] = tl;
      </script>
    </template>
  </body>
</html>
