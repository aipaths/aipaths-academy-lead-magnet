<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        .s4-scene {
          flex-direction: column;
          justify-content: space-between;
        }
        .s4-copy {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 36px;
        }
        .s4-in {
          opacity: 0;
          will-change: transform;
        }
        .s4-flow {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .s4-stack {
          position: relative;
          width: 440px;
          height: 290px;
        }
        .s4-sheet {
          position: absolute;
          width: 380px;
          height: 214px;
          overflow: hidden;
          background: var(--surface);
          border: 3px solid var(--line);
          border-radius: 10px;
          will-change: transform;
        }
        .s4-bar {
          position: absolute;
          left: 20px;
          height: 14px;
          border-radius: 7px;
          background: var(--muted);
        }
        .s4-mark {
          position: absolute;
          bottom: 28px;
          width: 30px;
          height: 30px;
          border-radius: 50%;
          background: var(--fg);
        }
        .s4-sheet-cap {
          position: absolute;
          right: 12px;
          bottom: 10px;
          font-family: var(--mono);
          font-size: 18px;
          color: var(--dim);
          font-variant-numeric: tabular-nums;
        }
        .s4-arrow {
          display: flex;
          align-items: center;
          transform-origin: 0% 50%;
        }
        .s4-shaft {
          display: block;
          width: 150px;
          height: 4px;
          background: var(--muted);
        }
        .s4-tip {
          display: block;
          width: 0;
          height: 0;
          border-top: 14px solid transparent;
          border-bottom: 14px solid transparent;
          border-left: 22px solid var(--muted);
        }
        .s4-ffmpeg {
          font-family: var(--mono);
          font-size: 30px;
          font-weight: 700;
          color: var(--fg);
          border: 3px solid var(--fg);
          padding: 18px 28px;
          will-change: transform;
        }
        .s4-file {
          display: flex;
          flex-direction: column;
          gap: 14px;
          padding: 34px 40px;
          background: var(--surface-2);
          border: 3px solid var(--signal);
          border-radius: 14px;
          min-width: 520px;
          will-change: transform;
        }
        .s4-name {
          font-family: var(--mono);
          font-size: 44px;
          font-weight: 700;
          color: var(--fg);
        }
        .s4-spec {
          font-family: var(--mono);
          white-space: nowrap;
          font-size: 24px;
          color: var(--muted);
          font-variant-numeric: tabular-nums;
        }
        .s4-cmd {
          font-family: var(--mono);
          font-size: 26px;
          color: var(--dim);
          border-top: 3px solid var(--line);
          padding-top: 26px;
          min-height: 70px;
          white-space: pre;
        }
        .s4-cmd b {
          color: var(--muted);
        }
      </style>
      <div
        id="root"
        data-composition-id="s4-ffmpeg"
        data-width="1920"
        data-height="1080"
      >
        <div class="scene s4-scene">
          <div class="s4-copy">
            <div id="s4-kicker" class="kicker s4-in">
              <span class="kicker-num">03</span>FFMPEG
            </div>
            <h2 id="s4-head" class="headline s4-in">
              Los frames se vuelven video
            </h2>
          </div>
          <div class="s4-flow">
            <div id="s4-stack" class="s4-stack">
              <div class="s4-sheet" style="left: 0; top: 0"></div>
              <div class="s4-sheet" style="left: 20px; top: 20px"></div>
              <div class="s4-sheet" style="left: 40px; top: 40px"></div>
              <div class="s4-sheet" style="left: 60px; top: 60px">
                <span class="s4-bar" style="top: 44px; width: 70%"></span>
                <span
                  class="s4-bar"
                  style="top: 74px; width: 48%; background: var(--dim)"
                ></span>
                <span class="s4-mark" style="left: 72%"></span>
                <span id="s4-sheet-cap" class="s4-sheet-cap">0001</span>
              </div>
            </div>
            <div id="s4-arrow1" class="s4-arrow">
              <span class="s4-shaft"></span><span class="s4-tip"></span>
            </div>
            <div id="s4-ffmpeg" class="s4-ffmpeg">ffmpeg</div>
            <div id="s4-arrow2" class="s4-arrow">
              <span class="s4-shaft"></span><span class="s4-tip"></span>
            </div>
            <div id="s4-file" class="s4-file">
              <span class="s4-name">intro.mp4</span>
              <span id="s4-spec" class="s4-spec"
                >600 frames · 30 fps · H.264 · 20 s</span
              >
            </div>
          </div>
          <div id="s4-cmd" class="s4-cmd s4-in"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });

        // Copy cascade (waterfall-entry).
        [
          ["#s4-kicker", 0.2, 30, 0.13],
          ["#s4-head", 0.3, 70, 0.2],
        ].forEach(([sel, at, dy, dur]) => {
          tl.set(sel, { opacity: 1, y: dy }, at);
          tl.to(sel, { y: 0, duration: dur, ease: "power4.out" }, at);
        });

        // Frames drop onto the stack, back to front (spring-pop-entrance, no overshoot).
        gsap.utils.toArray("#s4-stack .s4-sheet").forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: -40, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power3.out" },
            0.5 + i * 0.09,
          );
        });

        // The stack's top frame counts up to 0600 while frames pile in.
        const cap = document.getElementById("s4-sheet-cap");
        const spec = document.getElementById("s4-spec");
        const count = { n: 1 };
        let lastN = -1;
        const paintCount = () => {
          const n = Math.round(count.n);
          if (n === lastN) return;
          lastN = n;
          cap.textContent = String(n).padStart(4, "0");
        };
        paintCount();
        tl.to(
          count,
          { n: 600, duration: 1.0, ease: "power2.inOut", onUpdate: paintCount },
          0.6,
        );

        // Pipe: arrow → ffmpeg → arrow → file, each handing off to the next.
        tl.fromTo(
          "#s4-arrow1",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.3, ease: "power3.out" },
          1.0,
        );
        tl.fromTo(
          "#s4-ffmpeg",
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
          1.15,
        );
        tl.fromTo(
          "#s4-arrow2",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.3, ease: "power3.out" },
          1.4,
        );
        tl.fromTo(
          "#s4-file",
          { opacity: 0, scale: 0.9, x: -30 },
          { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "power3.out" },
          1.6,
        );

        // The command types itself along the bottom rule.
        const CMD =
          "$ ffmpeg -framerate 30 -i frame_%04d.png -c:v libx264 intro.mp4";
        const cmdEl = document.getElementById("s4-cmd");
        const typed = { p: 0 };
        let lastK = -1;
        const paintCmd = () => {
          const k = Math.round(typed.p * CMD.length);
          if (k === lastK) return;
          lastK = k;
          cmdEl.innerHTML =
            "<b>" +
            CMD.slice(0, Math.min(1, k)) +
            "</b>" +
            CMD.slice(1, Math.max(1, k));
        };
        paintCmd();
        tl.set("#s4-cmd", { opacity: 1 }, 1.0);
        tl.to(
          typed,
          { p: 1, duration: 1.2, ease: "none", onUpdate: paintCmd },
          1.0,
        );

        // The specs line lands with the file (dim → full) — holds to the end.
        tl.fromTo(spec, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.9);

        window.__timelines["s4-ffmpeg"] = tl;
      </script>
    </template>
  </body>
</html>
